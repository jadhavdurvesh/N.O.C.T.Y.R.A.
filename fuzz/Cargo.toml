[package]
name = "noctyra-container-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
noctyra-container = { path = "../crates/noctyra-container" }
noctyra-image = { path = "../crates/noctyra-image" }
noctyra-steganography = { path = "../crates/noctyra-steganography" }
noctyra-constellation = { path = "../crates/noctyra-constellation" }

[[bin]]
name = "nmf2_manifest"
path = "fuzz_targets/nmf2_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "carrier_image"
path = "fuzz_targets/carrier_image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "carrier_payload"
path = "fuzz_targets/carrier_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "constellation_fragment"
path = "fuzz_targets/constellation_fragment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "constellation_reassembly"
path = "fuzz_targets/constellation_reassembly.rs"
test = false
doc = false
bench = false

[[bin]]
name = "constellation_recovery"
path = "fuzz_targets/constellation_recovery.rs"
test = false
