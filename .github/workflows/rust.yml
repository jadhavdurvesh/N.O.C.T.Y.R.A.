name: NOCTYRA Core Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noctyra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ runner.os == 'Windows' && 'D:/work/noctyra' || 'noctyra' }}
    steps:
      - name: Checkout
        if: runner.os != 'Windows'
        uses: actions/checkout@v4
        with:
          path: noctyra

      # The repository name ends in a dot, which Windows forbids in a
      # directory component. Clone into a neutral path outside GITHUB_WORKSPACE.
      - name: Checkout on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: D:/
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path D:/work | Out-Null
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GITHUB_TOKEN"))
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone --depth 1 "https://github.com/$env:GITHUB_REPOSITORY.git" D:/work/noctyra

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        if: runner.os != 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: noctyra -> Cargo.lock

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Run workspace tests
        run: cargo test -p noctyra-crypto -p noctyra-container -p noctyra-core -p noctyra-cli -p noctyra-constellation -p noctyra-recovery -p noctyra-image -p noctyra-steganography -p noctyra-compression -p noctyra-keystore -p noctyra-validation --all-targets

      - name: Run Clippy
        run: cargo clippy -p noctyra-crypto -p noctyra-container -p noctyra-core -p noctyra-cli -p noctyra-constellation -p noctyra-recovery -p noctyra-image -p noctyra-steganography -p noctyra-compression -p noctyra-keystore -p noctyra-validation --all-targets -- -D warnings

  frontend:
    name: Desktop frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package.json

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
