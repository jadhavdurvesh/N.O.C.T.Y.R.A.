name: NOCTYRA Core Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noctyra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential curl wget file             libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev             librsvg2-dev patchelf libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        run: cargo test -p noctyra-crypto -p noctyra-container -p noctyra-core -p noctyra-cli --all-targets

      - name: Run Clippy
        run: cargo clippy -p noctyra-crypto -p noctyra-container -p noctyra-core -p noctyra-cli --all-targets -- -D warnings

  frontend:
    name: Desktop frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package.json

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
